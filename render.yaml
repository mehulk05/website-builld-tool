# Render blueprint — deploy as a persistent web service (free plan).
# Set the secret env vars in the Render dashboard (marked sync: false here).
services:
  - type: web
    name: g99-website-build-tool
    runtime: node
    plan: free
    buildCommand: bash render-build.sh
    startCommand: node server.js
    healthCheckPath: /api/auth-check
    envVars:
      # Where Playwright looks for its browser. render-build.sh installs Chromium
      # with this same value, which puts it inside node_modules rather than
      # ~/.cache so it survives into the running service — and Playwright only
      # finds it if install time and run time agree. Changing one without the
      # other silently hides the browser and the engine loses its screenshots
      # and its bot-wall fallback.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: STITCH_API_KEY
        sync: false          # set in dashboard
      - key: GEMINI_KEYS
        sync: false          # comma-separated list, set in dashboard
      - key: GH_TOKEN
        sync: false          # fine-grained PAT: Contents RW + Pull requests RW on the WP repo
      - key: ADMIN_PASSWORD
        sync: false          # protects /api/* — REQUIRED on a public URL
      - key: WEBHOOK_SECRET
        sync: false          # shared secret for /api/webhook/onboarding-submitted
      - key: OLLAMA_API_KEY
        sync: false          # optional 2nd provider, offered only in the Edit-with-AI chat
      - key: EMAIL_WEBHOOK_SECRET
        sync: false          # shared secret for /api/webhook/email-change — must match the Gmail Apps Script
      - key: EMAIL_ALLOWED_SENDERS
        value: growth99.com,growth99.net  # who may trigger a website change by email
      # TED — accepted email requests are filed as a comment on the beta site
      # revisions task. Without the token the integration is simply off.
      - key: TED_API_TOKEN
        sync: false          # READ_WRITE personal API token from TED
      - key: TED_REVISIONS_TASK_ID
        value: "9078"        # "Implement beta site revisions"
      - key: TED_AUTH_HEADER
        value: bearer        # or x-api-key, if Bearer 401s for personal tokens
      - key: TED_SHOT_DELAY_MS
        value: "60000"       # wait for the deploy to land before screenshotting
      - key: TED_SCREENSHOTS
        value: "on"          # off = outcome comments without the image
      # Content Review link posted onto the content-approval task when the
      # upstream content task closes.
      # Optional, like the other TED webhooks: checked when set, skipped when
      # not. Worth setting — but the minted link is never in the response, only
      # in the TED comment, so an unauthenticated caller cannot come away with
      # one. Must match the secret on the TED webhook, or every delivery 401s.
      - key: TED_REVIEW_WEBHOOK_SECRET
        sync: false          # set in dashboard; same value as TED's webhook secret
      - key: TED_REVIEW_TRIGGER_KEY
        value: content.create      # the task whose completion posts the link
      - key: TED_REVIEW_TARGET_KEY
        value: content.approval    # the task the link is posted on
      - key: TED_REVIEW_TTL_MIN
        value: "10080"       # 7 days — it waits in a task, unlike a hand-minted link
      # A reviewer's Apply publishes for real by default: it opens a pull request
      # against the client repository and auto-merges it. This used to be the
      # other way round, so that deploying the tool did not by itself grant that
      # permission; it was inverted deliberately.
      #
      # Set this to "off" on any deployment that should collect feedback without
      # writing to anyone's repository. "off", "0", "false" and "no" all work.
      - key: REVIEW_LIVE
        sync: false          # unset = publishes; set to "off" to collect only
      # Screenshots (TED outcome comments + CRO audit). Optional and PAID:
      # microlink's keyless tier is 25/day per calling IP and Render's egress IP
      # is shared, so it runs out here. Unset, captures fall back to WordPress
      # mShots, which needs no key and has no quota.
      - key: MICROLINK_API_KEY
        sync: false          # set in dashboard only if you buy a microlink plan
      # Pre-release mobile screenshots. Without it that step reports
      # "BROWSERLESS_TOKEN is not configured" and the run has no mobile evidence
      # to show, which is most of what a pre-release pass is for.
      - key: BROWSERLESS_TOKEN
        sync: false          # set in dashboard
      - key: BROWSERLESS_URL
        value: https://production-sfo.browserless.io   # private-fleet accounts use their own URL
      # Where build progress is reported back to Growth99 (dev). The G99 admin dashboard reads this
      # persisted status, so without it a build's outcome is never recorded on the platform side.
      # NOTE: this is the API-GATEWAY path. The gateway maps /publicv2/** -> public-api /api/public/v2/**;
      # posting to the raw /api/public/v2/... URL is WAF-blocked (403) and /public/... is 404.
      - key: G99_STATUS_CALLBACK_URL
        value: https://pub-api-dev.growthemr.com/publicv2/webhook/website-build-status
      - key: G99_STATUS_SECRET
        sync: false          # same value as WEBHOOK_SECRET (falls back to it when unset)
      # This service's own public base URL — used to turn /site/ and /reports/x.html into absolute
      # links so they work when rendered in the G99 admin UI.
      - key: G99_TOOL_PUBLIC_URL
        value: https://g99-website-build-tool.onrender.com
      - key: WP_REPO
        value: G99agency/prodteam.gogroth.com
