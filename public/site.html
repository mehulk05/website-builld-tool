<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth99 · Site</title>
<link rel="stylesheet" href="/theme.css?v=10">
<style>
  .wrap { max-width: 1200px; margin: 0 auto; padding: 30px 34px 90px; display: flex; flex-direction: column; gap: 18px; animation: g99fadeup .32s ease both; }

  .back { font-size: 12.5px; color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; width: fit-content; }
  .back:hover { color: var(--ink); }

  .hero { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .hero h1 { margin: 0; font-size: 23px; font-weight: 800; }
  .hero .dom { font-family: var(--mono); font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; margin-top: 3px; }
  .hero .dom:hover { color: var(--accent); }
  .hero .acts { margin-left: auto; display: flex; gap: 9px; flex-wrap: wrap; }

  .two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: start; }
  .two.flip { grid-template-columns: 1fr 1.35fr; }
  @media (max-width: 1000px) { .two, .two.flip { grid-template-columns: 1fr; } }

  /* The preview renders the live site at desktop width, then scales it down to
     fit. --pvScale is set from the frame's real width by site.js (and kept in
     sync on resize), so the shrunk page always fills the frame edge to edge. */
  .frame { position: relative; height: 322px; border-bottom: 1px solid var(--line); overflow: hidden; --pvScale: .42; }
  .frame iframe {
    width: 1280px; height: calc(322px / var(--pvScale)); border: 0; background: #fff;
    transform: scale(var(--pvScale)); transform-origin: 0 0;
  }
  .frame .ph { position: absolute; inset: 0; display: grid; place-items: center; }
  .frame .ph .wm { font-weight: 800; font-size: 76px; letter-spacing: -.04em; opacity: .26; }
  .frame .tag {
    position: absolute; top: 14px; left: 14px; font-family: var(--mono); font-size: 10.5px;
    /* near-opaque chip: it floats over the live preview / tinted placeholder */
    color: var(--ink-3); background: color-mix(in srgb, var(--surface) 94%, transparent);
    border-radius: 6px; padding: 3px 9px;
  }
  .frame .open { position: absolute; bottom: 14px; right: 14px; }
  .frame-ft { padding: 13px 18px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; }

  .scores { display: flex; align-items: center; gap: 14px; padding: 10px 0 16px; flex-wrap: wrap; }
  .scores .n { text-align: center; }
  .scores .n b { display: block; font-weight: 800; line-height: 1; }
  .scores .n i { display: block; font-style: normal; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; margin-top: 4px; }
  .disc { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .disc .lb { width: 104px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .disc .sc { width: 26px; text-align: right; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .kv { display: flex; align-items: center; gap: 11px; padding: 11px 0; border-top: 1px solid var(--line-2); }
  .kv .k { font-size: 13px; font-weight: 600; min-width: 0; }
  .kv .v { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  .hist { padding: 13px 0; border-top: 1px solid var(--line-2); }
  .hist .hd { display: flex; align-items: center; gap: 12px; }
  .hist .nm { font-size: 13px; font-weight: 700; }
  .hist .sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .hist .det {
    margin-top: 10px; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; animation: g99fadeup .2s ease both; display: none;
  }
  .hist.open .det { display: block; }
  .hist .det .grid { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; }
  .hist .det .grid span.k { color: var(--muted); font-weight: 600; }
  .hist .det .grid div.v { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
  .toggle { background: none; border: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; padding: 4px; }
  .toggle:hover { color: var(--ink); }

  /* ---- "Edit with…" hand-off modal ---- */
  .idepanel { width: min(600px, 94vw); max-height: 88vh; display: flex; flex-direction: column; }
  .idepanel .ph { padding: 18px 22px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
  .idepanel .ph h2 { margin: 0 0 3px; font-size: 16px; }
  .idepanel .ph p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .idepanel .pbody { padding: 16px 22px 18px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
  .idetabs { display: flex; gap: 2px; background: var(--line-2); padding: 3px; border-radius: 11px; }
  .idetabs button {
    flex: 1; font: inherit; font-size: 12.5px; font-weight: 700; border: none; border-radius: 8px;
    padding: 8px 10px; cursor: pointer; background: transparent; color: var(--ink-3);
    transition: background .14s, color .14s;
  }
  .idetabs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .idefield label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
  .idefield .ro {
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .idefield textarea { resize: vertical; }
  .idefield .final { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; min-height: 150px; }
  .idenote { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
  .idepanel .pf { display: flex; gap: 9px; align-items: center; padding: 14px 22px; border-top: 1px solid var(--line); background: var(--surface-2); flex-wrap: wrap; }
  .idepanel .pf .end { margin-left: auto; display: flex; gap: 9px; }
</style>
</head>
<body data-title="Site">
<main class="wrap" id="wrap">
  <p class="empty"><span class="spin"></span>Loading site…</p>
</main>
<div class="toast" id="toast"></div>
<script src="/nav.js"></script>
<script src="/site.js"></script>
</body>
</html>
