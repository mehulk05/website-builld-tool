<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth99 · GitHub access check</title>
<link rel="stylesheet" href="/theme.css?v=10">
<style>
  .wrap { max-width: 760px; margin: 0 auto; padding: 30px 34px 90px; display: flex; flex-direction: column; gap: 16px; }

  .warnbar {
    display: flex; align-items: flex-start; gap: 9px; padding: 11px 14px; border-radius: 12px;
    background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
    font-size: 12.5px; color: var(--warn-ink);
  }
  .warnbar svg { flex: none; margin-top: 1px; }

  .fields { display: grid; grid-template-columns: 1fr 160px; gap: 10px; margin-bottom: 14px; }
  label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
          color: var(--muted); font-weight: 700; margin-bottom: 5px; }
  input { width: 100%; font: inherit; font-family: var(--mono); font-size: 12.5px; padding: 8px 11px;
          border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); }
  input:focus { outline: none; border-color: var(--accent); }

  .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
  .modepill { font-size: 11px; font-weight: 700; border: 1px solid var(--line); border-radius: 20px;
              padding: 3px 10px; color: var(--muted); margin-left: auto; }

  .step { display: flex; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line-2); align-items: flex-start; }
  .step:first-child { border-top: 0; }
  .mark { width: 18px; flex: none; text-align: center; font-weight: 800; line-height: 1.4; }
  .step.ok .mark { color: var(--good); }
  .step.no .mark { color: var(--bad); }
  .step .lbl { font-weight: 600; font-size: 13px; }
  .step .det { color: var(--muted); font-size: 11.5px; font-family: var(--mono); word-break: break-word; margin-top: 2px; }
  .step a { font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body data-title="GitHub access check">
<main class="wrap">
  <div class="page-h">
    <div>
      <h1>GitHub access check</h1>
      <p>Clones the repo, appends one line to <code>.g99/smoke-test.md</code>, pushes a branch and opens a PR — using the same credentials the build pipeline uses.</p>
    </div>
  </div>

  <div class="warnbar" id="warn"></div>

  <div class="card pad">
    <div class="fields">
      <div>
        <label for="repo">Repository</label>
        <input id="repo" value="G99agency/prodteam1.gogroth.com" spellcheck="false">
      </div>
      <div>
        <label for="base">Base branch</label>
        <input id="base" value="main" spellcheck="false">
      </div>
    </div>
    <div class="row">
      <button class="btn primary" id="auto">Raise PR</button>
      <button class="btn ghost" id="app">Force GitHub App</button>
      <button class="btn ghost" id="pat">Force PAT</button>
      <span class="modepill" id="mode">…</span>
    </div>
  </div>

  <div class="card pad" id="out" style="display:none"></div>
</main>
<div class="toast" id="toast"></div>
<script src="/nav.js"></script>
<script src="/pr-smoke.js"></script>
</body>
</html>
