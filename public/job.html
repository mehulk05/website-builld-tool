<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth99 · Run detail</title>
<link rel="stylesheet" href="/theme.css?v=10">
<style>
  .wrap { max-width: 880px; margin: 0 auto; padding: 30px 34px 90px; display: flex; flex-direction: column; gap: 18px; animation: g99fadeup .32s ease both; }

  .back { font-size: 12.5px; color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; width: fit-content; }
  .back:hover { color: var(--ink); }

  .hero { display: flex; align-items: center; gap: 13px; flex-wrap: wrap; }
  .hero h1 { margin: 0; font-size: 20px; font-weight: 800; }
  .hero .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .hero .acts { margin-left: auto; display: flex; gap: 9px; flex-wrap: wrap; }

  .scores { display: flex; align-items: center; gap: 16px; padding: 18px 22px; flex-wrap: wrap; }
  .scores .n { text-align: center; }
  .scores .n b { display: block; font-weight: 800; line-height: 1; }
  .scores .n i { display: block; font-style: normal; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; margin-top: 4px; }

  .req { font-size: 14px; line-height: 1.6; color: var(--ink-2); margin: 0; }

  .wo-hd { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line-2); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .wo { list-style: none; margin: 4px 0 0; padding: 8px 0 0; border-top: 1px solid var(--line-2); counter-reset: wo; }
  .wo-hd + .wo { border-top: none; padding-top: 2px; }
  .wo li { position: relative; padding: 9px 0 9px 26px; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
  .wo li::before { counter-increment: wo; content: counter(wo); position: absolute; left: 0; top: 10px; width: 17px; height: 17px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .wo .vk { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; margin-right: 6px; vertical-align: -3px; }
  .wo .vk.yes { background: var(--good, #1f9d6b); color: #fff; }
  .wo .vk.no { background: var(--bad, #c0392b); color: #fff; }
  .wo .vk.none { border: 1.5px dashed var(--line); }
  .wo li:has(.vk.no) { color: var(--ink); font-weight: 600; }
  .wo .whr { color: var(--muted); font-weight: 600; }
  .wo .lit { display: block; margin-top: 4px; font-family: var(--mono); font-size: 11.5px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; word-break: break-word; }
  .wo .lit s { color: var(--muted); }
  .wo-note { margin-top: 10px; font-size: 12.5px; line-height: 1.55; color: var(--muted); }
  .wo-note b { color: var(--ink-2); font-weight: 700; }

  /* SEO run detail — one block per page */
  .seolist { display: flex; flex-direction: column; margin-top: 6px; }
  .seorow { padding: 11px 0; border-bottom: 1px solid var(--line-2); }
  .seorow:last-child { border-bottom: none; }
  .seohd { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 5px; }
  .seoslug { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink); }
  .seoslug s { color: var(--muted); }
  .seokw { font-size: 12px; color: var(--muted); font-weight: 600; }
  .seot { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
  .seod { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-top: 2px; }
  .seot i, .seod i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .seod code { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
  .seofail { margin-top: 5px; font-size: 12px; font-weight: 600; color: var(--warn-ink); }
  .seomiss { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }

  /* pre-release mobile screenshots */
  .mobsummary { margin: 8px 0 4px; color: var(--muted); font-size: 12.5px; }
  .mobsummary b { color: var(--ink-2); }
  .moblist { display: flex; flex-direction: column; }
  .mobrow { padding: 16px 0; border-bottom: 1px solid var(--line-2); }
  .mobrow:last-child { border-bottom: none; }
  .mobhd { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
  .mobhd a { font-family: var(--mono); font-size: 12px; font-weight: 700; }
  .mobhd span { color: var(--muted); font-size: 12px; }
  .mobgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 220px)); gap: 12px; align-items: start; }
  .mobshot { position: relative; display: block; height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
  .mobshot > span { position: sticky; top: 6px; left: 6px; z-index: 1; display: inline-block; margin: 6px; padding: 3px 7px; border-radius: 6px; background: color-mix(in srgb, var(--surface) 94%, transparent); color: var(--ink-2); font-size: 10px; font-weight: 800; }
  .mobshot img { display: block; width: 100%; height: auto; margin-top: -26px; }
  .mobissues { margin: 9px 0 0; padding-left: 18px; color: var(--warn-ink); font-size: 12px; line-height: 1.5; }
  .mobissues li + li { margin-top: 4px; }
  .mobissues b { text-transform: uppercase; font-size: 10px; margin-right: 4px; }
  .mobissues span { display: block; color: var(--muted); }
  .moberr { margin-top: 8px; color: var(--bad); font-size: 12px; font-weight: 600; }
  @media (max-width: 600px) { .mobgrid { grid-template-columns: 1fr; } }

  .disc-btn { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: none; padding: 0; font: inherit; cursor: pointer; color: var(--ink); }
  .disc-btn .t { font-size: 13.5px; font-weight: 700; }
  .disc-btn .h { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 600; }
  .tech { margin-top: 14px; display: none; }
  .tech.open { display: block; }
  .tech .grid { display: flex; gap: 24px; flex-wrap: wrap; font-size: 12.5px; }
  .tech .grid .k { color: var(--muted); font-weight: 600; }
  .tech .grid .v { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-top: 3px; word-break: break-all; }

  .diff {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55; white-space: pre-wrap;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; max-height: 460px; overflow: auto; margin: 0; color: var(--ink-2);
  }
  .diff .a { color: var(--good); }
  .diff .d { color: var(--bad); }

  /* ---- per-step detail: brand swatches, build prompt, per-page status ---- */
  .swatches { display: flex; flex-wrap: wrap; gap: 16px; }
  .swatches .sw { display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
  .swatches .sw i { width: 62px; height: 40px; border-radius: 8px; border: 1px solid var(--line); display: block; }
  .swatches .sw b { font-weight: 700; color: var(--ink-2); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; }
  .swatches .sw code { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .kv { font-size: 12.5px; color: var(--muted); margin-top: 10px; font-weight: 600; }

  details.brief { margin-top: 10px; }
  details.brief summary { cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--accent); }
  details.brief > div {
    white-space: pre-wrap; font-size: 12px; line-height: 1.6; color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 8px;
    max-height: 280px; overflow: auto; background: var(--surface-2);
  }
  /* The copy button floats over the scroll box, so it stays reachable without scrolling
     to the end of a 2,500-character prompt. */
  details.brief .briefwrap { position: relative; }
  details.brief .briefwrap > div { margin-top: 8px; }
  .copybtn {
    position: absolute; top: 16px; right: 10px; z-index: 2;
    display: inline-flex; align-items: center; gap: 5px;
    font: inherit; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer;
    box-shadow: var(--shadow-sm);
  }
  .copybtn:hover { color: var(--ink); border-color: var(--accent); }
  .copybtn.copied { color: var(--good); border-color: var(--good); }

  .pages { display: flex; flex-direction: column; gap: 2px; }
  .pg { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 5px 0; }
  .pg .pgn { font-weight: 600; color: var(--ink-2); min-width: 84px; }
  .pg .pgs { color: var(--muted); }
  .pg.done .pgs { color: var(--good); font-variant-numeric: tabular-nums; }
  .pg.error .pgs { color: var(--bad); }
  .pg.generating .pgn, .pg.generating .pgs { color: var(--accent); }
  .pg.queued .pgn { color: var(--muted); }

  /* enrich: per-service provenance rows */
  .svc-list { display: flex; flex-direction: column; }
  .svc { padding: 10px 0; border-bottom: 1px solid var(--line-2); }
  .svc:last-child { border-bottom: none; }
  .svc-hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .svc-nm { font-weight: 700; font-size: 13.5px; }
  .svc-slug { font-family: var(--mono); font-size: 11.5px; color: var(--muted); background: var(--line-2); border-radius: 6px; padding: 2px 8px; }
  .svc-src { margin-left: auto; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .svc-src.none { color: var(--muted); font-weight: 500; }
  .svc details.brief { margin-top: 8px; margin-left: 18px; }

  /* per-service generation status */
  .svc-st { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border-radius: 999px; padding: 3px 9px; }
  .svc-st.queued { background: var(--line-2); color: var(--muted); }
  .svc-st.running { background: var(--accent-soft); color: var(--accent); }
  .svc-st.done { background: var(--good-soft); color: var(--good); }
  .svc-st.error { background: var(--bad-soft); color: var(--bad); }

  /* readable brief: real line-height, comfortable measure, roomy scroll box */
  details.brief > div.brieftext {
    white-space: pre-wrap; font-size: 13.5px; line-height: 1.75; color: var(--ink-2);
    border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px;
    padding: 16px 18px; margin-top: 8px; max-width: 78ch;
    max-height: 60vh; overflow-y: auto; background: var(--surface-2);
  }

  /* client & build-target rows (what the onboarding form brought in) */
  .card .kv { display: flex; align-items: baseline; gap: 12px; padding: 7px 0; margin: 0;
              border-bottom: 1px solid var(--line-2); font-size: 13px; font-weight: 400; color: var(--ink); }
  .card .kv:last-child { border-bottom: none; }
  .card .kv .k { flex: none; width: 116px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .card .kv .v { flex: 1; min-width: 0; word-break: break-word; color: var(--ink-2); }
  .card .kv a.v { color: var(--accent); font-weight: 600; }

  /* ---- 3-dot menu + edit drawer ---- */
  .dots-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink-2); flex-shrink: 0; }
  .dots-btn:hover { background: var(--surface-2); color: var(--ink); }

  .job-menu { position: absolute; z-index: 200; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; min-width: 170px; display: none; }
  .job-menu.open { display: block; }
  .job-menu button { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: none; padding: 8px 11px; border-radius: 7px; font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; text-align: left; }
  .job-menu button:hover { background: var(--surface-2); color: var(--ink); }

  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 300; display: none; }
  .drawer-overlay.open { display: block; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: 520px; max-width: 100vw; background: var(--surface); border-left: 1px solid var(--line); z-index: 301; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .22s ease; }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; gap: 10px; padding: 18px 20px 16px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .drawer-head h2 { margin: 0; font-size: 15px; font-weight: 800; flex: 1; }
  .drawer-head button { background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; border-radius: 6px; display: flex; }
  .drawer-head button:hover { color: var(--ink); background: var(--surface-2); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
  .drawer-section { display: flex; flex-direction: column; gap: 10px; }
  .drawer-section-title { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--line-2); }
  .dfield { display: flex; flex-direction: column; gap: 5px; }
  .dfield label { font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .dfield input, .dfield textarea { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; outline: none; width: 100%; box-sizing: border-box; }
  .dfield input:focus, .dfield textarea:focus { border-color: var(--accent); background: var(--surface); }
  .dfield textarea { resize: vertical; min-height: 72px; }
  .dfield .hint { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .drawer-tabs { display: flex; gap: 2px; background: var(--surface-2); border-radius: 9px; padding: 3px; }
  .drawer-tabs button { flex: 1; font: inherit; font-size: 12.5px; font-weight: 600; border: none; background: none; border-radius: 7px; padding: 6px; cursor: pointer; color: var(--muted); }
  .drawer-tabs button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .drawer-foot { padding: 16px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; flex-shrink: 0; }
  .drawer-foot .btn { flex: 1; justify-content: center; }

  /* chips */
  .chips-wrap { display: flex; flex-wrap: wrap; gap: 6px; min-height: 32px; padding: 6px 0 4px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 10px 4px 12px; font-size: 12.5px; font-weight: 600; }
  .chip-rm { background: none; border: none; cursor: pointer; color: inherit; opacity: .6; padding: 0; font-size: 11px; line-height: 1; display: flex; align-items: center; }
  .chip-rm:hover { opacity: 1; }
  .chip-add-row { display: flex; gap: 7px; align-items: center; margin-top: 4px; }
  .chip-input { flex: 1; font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; outline: none; }
  .chip-input:focus { border-color: var(--accent); background: var(--surface); }
</style>
</head>
<body data-title="Run detail">
<main class="wrap" id="wrap">
  <p class="empty"><span class="spin"></span>Loading run…</p>
</main>
<div class="toast" id="toast"></div>
<script src="/nav.js"></script>
<script src="/job.js"></script>
</body>
</html>
