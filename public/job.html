<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth99 · Run detail</title>
<link rel="stylesheet" href="/theme.css?v=10">
<style>
  .wrap { max-width: 880px; margin: 0 auto; padding: 30px 34px 90px; display: flex; flex-direction: column; gap: 18px; animation: g99fadeup .32s ease both; }

  .back { font-size: 12.5px; color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; width: fit-content; }
  .back:hover { color: var(--ink); }

  .hero { display: flex; align-items: center; gap: 13px; flex-wrap: wrap; }
  .hero h1 { margin: 0; font-size: 20px; font-weight: 800; }
  .hero .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .hero .acts { margin-left: auto; display: flex; gap: 9px; flex-wrap: wrap; }

  .scores { display: flex; align-items: center; gap: 16px; padding: 18px 22px; flex-wrap: wrap; }
  .scores .n { text-align: center; }
  .scores .n b { display: block; font-weight: 800; line-height: 1; }
  .scores .n i { display: block; font-style: normal; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; margin-top: 4px; }

  .req { font-size: 14px; line-height: 1.6; color: var(--ink-2); margin: 0; }

  .wo-hd { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line-2); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .wo { list-style: none; margin: 4px 0 0; padding: 8px 0 0; border-top: 1px solid var(--line-2); counter-reset: wo; }
  .wo-hd + .wo { border-top: none; padding-top: 2px; }
  .wo li { position: relative; padding: 9px 0 9px 26px; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
  .wo li::before { counter-increment: wo; content: counter(wo); position: absolute; left: 0; top: 10px; width: 17px; height: 17px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .wo .vk { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; margin-right: 6px; vertical-align: -3px; }
  .wo .vk.yes { background: var(--good, #1f9d6b); color: #fff; }
  .wo .vk.no { background: var(--bad, #c0392b); color: #fff; }
  .wo .vk.none { border: 1.5px dashed var(--line); }
  .wo li:has(.vk.no) { color: var(--ink); font-weight: 600; }
  .wo .whr { color: var(--muted); font-weight: 600; }
  .wo .lit { display: block; margin-top: 4px; font-family: var(--mono); font-size: 11.5px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; word-break: break-word; }
  .wo .lit s { color: var(--muted); }
  .wo-note { margin-top: 10px; font-size: 12.5px; line-height: 1.55; color: var(--muted); }
  .wo-note b { color: var(--ink-2); font-weight: 700; }

  .disc-btn { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: none; padding: 0; font: inherit; cursor: pointer; color: var(--ink); }
  .disc-btn .t { font-size: 13.5px; font-weight: 700; }
  .disc-btn .h { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 600; }
  .tech { margin-top: 14px; display: none; }
  .tech.open { display: block; }
  .tech .grid { display: flex; gap: 24px; flex-wrap: wrap; font-size: 12.5px; }
  .tech .grid .k { color: var(--muted); font-weight: 600; }
  .tech .grid .v { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-top: 3px; word-break: break-all; }

  .diff {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55; white-space: pre-wrap;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; max-height: 460px; overflow: auto; margin: 0; color: var(--ink-2);
  }
  .diff .a { color: var(--good); }
  .diff .d { color: var(--bad); }

  /* ---- per-step detail: brand swatches, build prompt, per-page status ---- */
  .swatches { display: flex; flex-wrap: wrap; gap: 16px; }
  .swatches .sw { display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
  .swatches .sw i { width: 62px; height: 40px; border-radius: 8px; border: 1px solid var(--line); display: block; }
  .swatches .sw b { font-weight: 700; color: var(--ink-2); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; }
  .swatches .sw code { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .kv { font-size: 12.5px; color: var(--muted); margin-top: 10px; font-weight: 600; }

  details.brief { margin-top: 10px; }
  details.brief summary { cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--accent); }
  details.brief > div {
    white-space: pre-wrap; font-size: 12px; line-height: 1.6; color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 8px;
    max-height: 280px; overflow: auto; background: var(--surface-2);
  }

  .pages { display: flex; flex-direction: column; gap: 2px; }
  .pg { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 5px 0; }
  .pg .pgn { font-weight: 600; color: var(--ink-2); min-width: 84px; }
  .pg .pgs { color: var(--muted); }
  .pg.done .pgs { color: var(--good); font-variant-numeric: tabular-nums; }
  .pg.error .pgs { color: var(--bad); }
  .pg.generating .pgn, .pg.generating .pgs { color: var(--accent); }
  .pg.queued .pgn { color: var(--muted); }
</style>
</head>
<body data-title="Run detail">
<main class="wrap" id="wrap">
  <p class="empty"><span class="spin"></span>Loading run…</p>
</main>
<div class="toast" id="toast"></div>
<script src="/nav.js"></script>
<script src="/job.js"></script>
</body>
</html>
