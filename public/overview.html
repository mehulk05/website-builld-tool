<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth99 · Overview</title>
<link rel="stylesheet" href="/theme.css?v=10">
<style>
  .wrap { max-width: 1200px; margin: 0 auto; padding: 30px 34px 90px; display: flex; flex-direction: column; gap: 22px; animation: g99fadeup .32s ease both; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-sm); padding: 16px 17px; }
  .kpi .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  .kpi .v { font-size: 28px; font-weight: 800; margin-top: 8px; letter-spacing: -.02em; line-height: 1; }
  .kpi .s { font-size: 12px; color: var(--ink-3); font-weight: 600; margin-top: 6px; display: flex; align-items: center; gap: 6px; }

  .cols { display: grid; grid-template-columns: 1.42fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

  /* active task row */
  .task { display: flex; flex-direction: column; gap: 10px; padding: 15px 0; border-top: 1px solid var(--line-2); cursor: pointer; }
  .task .hd { display: flex; align-items: center; gap: 11px; }
  .task .nm { font-size: 13.5px; font-weight: 700; }
  .task .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .task .mt { display: flex; align-items: center; gap: 12px; }
  .task .eta { font-size: 11.5px; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
  .task .cost { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .approve { display: flex; gap: 8px; align-items: center; padding: 9px 12px; background: var(--warn-soft); border-radius: 10px; }
  .approve svg { width: 15px; height: 15px; color: var(--warn); flex: none; }
  .approve span { font-size: 12px; color: var(--warn-ink); font-weight: 600; flex: 1; }

  .att { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line-2); }
  .att .nm { font-size: 13px; font-weight: 700; }
  .att .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .health { display: flex; align-items: center; gap: 11px; padding: 11px 0; border-top: 1px solid var(--line-2); cursor: pointer; text-decoration: none; color: inherit; }
  .health .nm { font-size: 13px; font-weight: 700; }
  .health .st { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .health .sc { font-size: 15px; font-weight: 800; line-height: 1; }
  .health .dl { font-size: 10.5px; font-weight: 700; margin-top: 2px; color: var(--good); }

  .act { display: flex; gap: 11px; padding: 11px 0; border-top: 1px solid var(--line-2); text-decoration: none; color: inherit; }
  .act .nm { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .act .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body data-title="Overview">
<main class="wrap" id="g99main">
  <div class="page-h">
    <div>
      <h1 id="greet">Website Studio</h1>
      <p id="subline">Loading your sites and runs…</p>
    </div>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <a class="btn" href="/edit" id="editBtn">Edit a site</a>
      <a class="btn primary" href="/dashboard">New site</a>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="cols">
    <div class="col">
      <div class="card pad" style="padding-bottom:6px">
        <div class="card-h">
          <h2>Active tasks</h2>
          <span class="pill accent" id="activeCount">0 running</span>
          <a class="right linkbtn" href="/jobs">View all →</a>
        </div>
        <div id="active"><p class="empty"><span class="spin"></span>Loading…</p></div>
      </div>

      <div class="card pad" style="padding-bottom:8px">
        <div class="card-h"><h2>Needs attention</h2><span class="pill warn" id="attCount">0</span></div>
        <div id="attention"></div>
      </div>
    </div>

    <div class="col">
      <div class="card pad" style="padding-bottom:10px">
        <div class="card-h"><h2>Site health</h2><a class="right linkbtn" href="/sites">All sites →</a></div>
        <div id="health"><p class="empty"><span class="spin"></span>Loading…</p></div>
      </div>

      <div class="card pad" style="padding-bottom:10px">
        <div class="card-h"><h2>Recent activity</h2></div>
        <div id="recent"></div>
      </div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script src="/nav.js"></script>
<script src="/overview.js"></script>
</body>
</html>
