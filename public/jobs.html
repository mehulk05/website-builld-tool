<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth99 · Activity</title>
<link rel="stylesheet" href="/theme.css?v=10">
<style>
  .wrap { max-width: 1200px; margin: 0 auto; padding: 30px 34px 90px; display: flex; flex-direction: column; gap: 20px; animation: g99fadeup .32s ease both; }

  .bar-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bar-row .search { max-width: 260px; flex: 1; margin-left: auto; }

  .run { display: flex; flex-direction: column; gap: 10px; padding: 15px 0; border-top: 1px solid var(--line-2); text-decoration: none; color: inherit; }
  .run .hd { display: flex; align-items: center; gap: 12px; }
  .run .nm { font-size: 13.5px; font-weight: 700; }
  .run .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .run .mt { display: flex; align-items: center; gap: 12px; }
  .run .eta { font-size: 11.5px; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
  .run .cost { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .run.compact { flex-direction: row; align-items: center; padding: 14px 0; }

  /* client info carried in from the onboarding form / HubSpot deal */
  .cmeta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .cm {
    font-size: 11px; font-weight: 600; color: var(--ink-3);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 8px; white-space: nowrap;
    max-width: 260px; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body data-title="Activity">
<main class="wrap" id="g99main">
  <div class="page-h">
    <div>
      <h1>Activity</h1>
      <p id="sub">Everything running across your sites, live — plus what shipped recently.</p>
    </div>
  </div>

  <div class="bar-row">
    <div class="seg" id="filters" role="group" aria-label="Filter runs">
      <button data-f="all" class="on" aria-pressed="true">All</button>
      <button data-f="edit" aria-pressed="false">Edits</button>
      <button data-f="build" aria-pressed="false">Builds</button>
      <button data-f="enrich" aria-pressed="false">Enrichments</button>
      <button data-f="attention" aria-pressed="false">Needs you</button>
    </div>
    <label for="search" class="vh">Search runs by site</label>
    <div class="search">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.3-4.3M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
      <input id="search" type="search" placeholder="Search by site…">
    </div>
  </div>

  <div class="card pad" style="padding-bottom:6px">
    <div class="card-h"><h2>In progress</h2><span class="pill accent" id="activeCount">0 running</span></div>
    <div id="active"><p class="empty"><span class="spin"></span>Loading runs…</p></div>
  </div>

  <div class="card pad" style="padding-bottom:10px">
    <div class="card-h"><h2>Recently completed</h2><span class="pill" id="doneCount">0</span></div>
    <div id="done"></div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script src="/nav.js"></script>
<script src="/jobs.js"></script>
</body>
</html>
