<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth99 · Pipeline Jobs</title>
<style>
  :root{
    --bg:#f4f5f8; --panel:#ffffff; --ink:#1c1d29; --muted:#6b6f82; --line:#e6e8f0;
    --accent:#6d4e8c; --accent-2:#8a6bb0; --good:#1f9d6b; --warn:#c9772b; --bad:#c0392b;
    --radius:16px; --shadow:0 1px 2px rgba(20,20,40,.04),0 8px 24px rgba(20,20,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14151c; --panel:#1c1e28; --ink:#ecedf3; --muted:#9a9fb5; --line:#2b2e3c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
  a{color:var(--accent)}
  .wrap{max-width:980px;margin:0 auto;padding:28px 24px 80px}
  .top{display:flex;align-items:center;gap:14px;margin-bottom:24px}
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px}
  .top h1{font-size:17px;margin:0;font-weight:700}
  .top .sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
  .stat{margin-left:auto;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:999px;box-shadow:var(--shadow)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}
  .jhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .jhead h2{font-size:15px;margin:0;font-weight:700}
  .jhead .meta{font-size:12.5px;color:var(--muted)}
  .badge{font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px;border:1px solid var(--line)}
  .badge.running{color:var(--accent);border-color:var(--accent)}
  .badge.done{color:var(--good);border-color:var(--good)}
  .badge.error{color:var(--bad);border-color:var(--bad)}
  .badge.queued{color:var(--muted)}
  .scores{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .scores .d{font-size:15px}
  .steps{margin-top:14px;display:flex;flex-direction:column;gap:6px}
  .jstep{display:flex;gap:10px;align-items:baseline;font-size:13.5px}
  .jstep .ic{flex:none;width:18px;text-align:center}
  .jstep .lb{flex:none;width:220px}
  .jstep .dt{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .jstep.pending{color:var(--muted);opacity:.6}
  .jstep.running .ic{color:var(--accent)}
  .jstep.done .ic{color:var(--good)}
  .jstep.error .ic,{color:var(--bad)}
  .links{margin-top:12px;display:flex;gap:14px;font-size:13px;flex-wrap:wrap}
  .empty{color:var(--muted);text-align:center;padding:60px 0}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">g</div>
    <div>
      <div class="sub">Growth99</div>
      <h1>Pipeline Jobs</h1>
    </div>
    <div class="stat" id="stat">Loading…</div>
  </div>
  <div id="list"><div class="empty">Waiting for jobs — submit an onboarding form (or POST the webhook) and runs appear here live.</div></div>
</div>
<script src="/jobs.js"></script>
</body>
</html>
