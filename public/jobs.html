<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth99 · Pipeline Jobs</title>
<link rel="stylesheet" href="/theme.css?v=2">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: transparent;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.5;
  }
  a { color: var(--accent); text-decoration: none; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 38px 30px 90px; }

  /* page header */
  .phead { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 22px; }
  .phead h1 { font-size: 26px; margin: 0 0 2px; }
  .phead p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .phead .stat {
    margin-left: auto; font-size: 12px; color: var(--accent);
    background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
    padding: 5px 12px; border-radius: 99px; font-weight: 600;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .card:hover { border-color: color-mix(in srgb, var(--ink) 12%, var(--line)); }
  .jhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .jhead h2 { font-size: 14.5px; margin: 0; font-weight: 700; }
  .jhead .meta { font-size: 11.5px; color: var(--muted); }
  .jhead .badge { margin-left: auto; }
  .jhead .scores { margin-left: 0; }

  .badge { font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; text-transform: uppercase; letter-spacing: .03em; }
  .badge.running { color: var(--accent); background: var(--accent-soft); }
  .badge.done { color: var(--good); background: var(--good-soft); }
  .badge.error { color: var(--bad); background: var(--bad-soft); }
  .badge.queued { color: var(--muted); background: var(--line-2); }

  .scores { margin-left: auto; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; font-family: var(--display); }
  .scores .d { font-size: 13px; font-weight: 700; }

  .steps { margin-top: 14px; }

  .links { margin-top: 12px; display: flex; gap: 8px; font-size: 12px; flex-wrap: wrap; }
  .links a { color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); padding: 6px 11px; border-radius: 8px; }
  .links a:hover { filter: brightness(.97); }
  .empty { color: var(--muted); text-align: center; padding: 56px 0; font-size: 13px; }

  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -1px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* summary tiles */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat-tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .stat-tile .v { font-size: 24px; font-weight: 800; line-height: 1; color: var(--ink); font-family: var(--display); }
  .stat-tile .k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; font-weight: 600; }

  /* segmented filters */
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .fgroup { display: flex; gap: 2px; background: var(--line-2); padding: 3px; border-radius: 10px; }
  .chipbtn { font-size: 12.5px; border: none; background: transparent; color: var(--ink-3); border-radius: 7px; padding: 6px 13px; cursor: pointer; font-weight: 600; letter-spacing: -.01em; }
  .chipbtn:hover { color: var(--ink); }
  .chipbtn.on { background: var(--primary); color: var(--primary-ink); }

  .fsearch {
    margin-left: auto;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 9px;
    padding: 7px 13px;
    font: inherit;
    font-size: 12.5px;
    min-width: 190px;
    outline: none;
  }
  .fsearch:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .fsearch::placeholder { color: var(--muted); }

  .prompt-line { margin: 8px 0 4px; font-size: 13.5px; }
  .prompt-line b { font-weight: 700; }
  .plan-line { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="phead">
    <div>
      <h1>Pipeline jobs</h1>
      <p>Every build &amp; edit run, live — webhook-triggered and manual.</p>
    </div>
    <div class="stat" id="stat">Loading…</div>
  </div>

  <div class="stats" id="summary"></div>

  <div class="filters" id="filters">
    <div class="fgroup" id="fStatus"></div>
    <div class="fgroup" id="fType"></div>
    <input id="fSearch" class="fsearch" placeholder="Search business…">
  </div>

  <div id="list"><div class="empty">Waiting for jobs — submit an onboarding form (or POST the webhook) and runs appear here live.</div></div>
</div>
<script src="/nav.js"></script>
<script src="/jobs.js"></script>
</body>
</html>
