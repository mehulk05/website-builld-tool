<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth99 · Edit a site</title>
<link rel="stylesheet" href="/theme.css?v=10">
<style>
  body { height: 100vh; overflow: hidden; }
  .shell { height: 100vh; display: flex; flex-direction: column; gap: 12px; padding: 14px; animation: g99fadeup .32s ease both; }

  /* ---- top bar ----
     Deliberately NOT called .bar: theme.css owns .bar as the 6px progress bar
     (height + overflow:hidden), which silently collapsed this header. */
  .topbar { display: flex; align-items: center; gap: 13px; flex-wrap: wrap; flex: none; }
  .topbar .back { color: var(--muted); display: inline-flex; }
  .topbar .back:hover { color: var(--ink); }
  .topbar .nm { font-size: 15px; font-weight: 800; letter-spacing: -.01em; margin: 0; }
  .topbar .dm { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 1px; }
  .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }

  .panes { display: grid; grid-template-columns: 400px 1fr; gap: 14px; flex: 1; min-height: 0; }
  /* Chat panel collapsed — the preview takes the whole width. */
  .panes.nochat { grid-template-columns: 1fr; }
  .panes.nochat .chatpane { display: none; }
  .mobtabs { display: none; }
  /* One column on small screens — the two panes become tabs rather than the
     preview simply vanishing. */
  @media (max-width: 900px) {
    .panes, .panes.nochat { grid-template-columns: 1fr; }
    .mobtabs { display: flex; flex: none; }
    .panes.show-chat .prev { display: none; }
    /* the tabs own the panel switch here, so they also override .nochat */
    .panes.show-chat .chatpane { display: flex; }
    .panes.show-preview .chatpane { display: none; }
    #togglePane { display: none; }
  }

  .pane {
    display: flex; flex-direction: column; min-width: 0;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: var(--shadow-sm); overflow: hidden;
  }

  /* ---- chat ----
     Deliberately minimal: assistant turns are plain text, and a run collapses to
     one status line. The blow-by-blow of a run lives on the Activity screen. */
  .thread { flex: 1; overflow: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 15px; }
  .msg { display: flex; }
  .msg .col { width: 100%; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
  .msg.user { justify-content: flex-end; }
  .msg.user .col { width: auto; max-width: 85%; align-items: flex-end; }
  .say { font-size: 13.5px; line-height: 1.55; color: var(--ink); }
  .bubble {
    border-radius: 14px; padding: 10px 14px; font-size: 13.5px; line-height: 1.5;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);
  }

  .run { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; display: flex; flex-direction: column; gap: 7px; }
  .run .rl { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; }
  .run .rl .grow { flex: 1; min-width: 0; }
  .run .sum { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }
  .run .acts { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 2px; }
  .run .acts .end { margin-left: auto; }
  /* The chat pane is deliberately monochrome, like the reference: only
     success / warning / failure carry colour. */
  .chatpane .spin { border-top-color: var(--ink); margin: 0; }
  .chatpane .linkbtn { color: var(--ink-2); }
  .chatpane .linkbtn:hover { color: var(--ink); }

  .composer { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; flex: none; }
  .chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    border-radius: 99px; padding: 6px 11px; cursor: pointer; font-weight: 600; flex: none;
    transition: border-color .14s, color .14s, background .14s;
  }
  .chip:hover { border-color: var(--ink-3); color: var(--ink); background: var(--line-2); }
  .chip svg { color: var(--muted); }
  .chip:hover svg { color: var(--ink); }

  .box {
    display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--line);
    border-radius: 13px; padding: 8px 8px 8px 13px; background: var(--surface-2);
    transition: border-color .14s, box-shadow .14s, background .14s;
  }
  .box:focus-within { border-color: var(--ink-3); background: var(--surface); box-shadow: 0 0 0 3px var(--line-2); }

  /* model picker — small and out of the way; the chat is the main event */
  .modelrow { display: flex; align-items: center; gap: 7px; }
  .modelrow label { font-size: 11px; font-weight: 700; color: var(--muted); }
  .modelrow select {
    width: auto; flex: none; font-size: 11.5px; font-weight: 600;
    padding: 4px 8px; border-radius: 8px; background: var(--surface);
    border: 1px solid var(--line); color: var(--ink-2); box-shadow: none;
  }
  .modelrow select:focus { box-shadow: none; border-color: var(--ink-3); }
  .box textarea {
    flex: 1; border: none; outline: none; background: none; font: inherit; font-size: 13.5px;
    line-height: 1.5; color: var(--ink); resize: none; max-height: 120px; padding: 5px 0;
    box-shadow: none; border-radius: 0;
  }
  .box textarea:focus { box-shadow: none; }
  .iconbtn {
    flex: none; width: 34px; height: 34px; border-radius: 9px; border: none;
    background: var(--ink-btn); color: #fff; display: grid; place-items: center;
    cursor: pointer; padding: 0; transition: filter .14s;
  }
  .iconbtn:hover { filter: brightness(1.18); }
  .iconbtn:disabled { opacity: .45; cursor: not-allowed; }
  .iconbtn.ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
  .iconbtn.ghost:hover { border-color: var(--ink-3); color: var(--ink); filter: none; }

  /* ---- preview ---- */
  .pv-bar { display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); flex: none; }
  .pv-bar .lights { display: flex; gap: 6px; flex: none; }
  .pv-bar .lights i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .pv-bar .url {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; max-width: 340px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px;
  }
  .pv-bar .url span { font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-stage { flex: 1; overflow: auto; background: #ecece8; display: flex; justify-content: center; padding: 0; }
  .pv-stage.mobile { padding: 22px; }
  .pv-stage iframe { width: 100%; height: 100%; border: 0; background: #fff; transition: width .28s ease; }
  .pv-stage.mobile iframe { width: 390px; max-width: 100%; border-radius: 18px; align-self: flex-start; height: calc(100% - 44px); box-shadow: 0 1px 3px rgba(0, 0, 0, .06); }
  .pv-empty { flex: 1; display: grid; place-items: center; background: var(--surface-2); text-align: center; padding: 40px; }

  /* ---- version history slide-over ---- */
  .vscrim { position: fixed; inset: 0; z-index: 240; background: rgba(18, 18, 26, .32); backdrop-filter: blur(3px); }
  .vpanel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(430px, 94vw); z-index: 241;
    display: flex; flex-direction: column; background: var(--surface);
    border-left: 1px solid var(--line); box-shadow: var(--shadow-lg); animation: g99slidein .2s ease both;
  }
  @keyframes g99slidein { from { transform: translateX(26px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .vpanel { animation: none; } }
  .vpanel .vh2 { display: flex; align-items: flex-start; gap: 10px; padding: 16px 18px 14px; border-bottom: 1px solid var(--line); }
  .vpanel .vh2 h2 { margin: 0 0 3px; font-size: 15px; }
  .vpanel .vh2 p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .vpanel .vlist { flex: 1; overflow: auto; padding: 8px; }
  .ver { display: flex; align-items: flex-start; gap: 11px; padding: 11px 12px; border-radius: 10px; }
  .ver + .ver { border-top: 1px solid var(--line-2); }
  .ver:hover { background: var(--line-2); }
  .ver .vt { flex: 1; min-width: 0; }
  .ver .vt .t { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.4; }
  .ver .vt .m { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .ver .vt .m .sha { font-family: var(--mono); }
  .ver .vt .m a { color: var(--ink-2); text-decoration: underline; }

  /* ---- site picker overlay ---- */
  .picker { position: fixed; inset: 0; z-index: 250; background: rgba(18, 18, 26, .32); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 24px; }
  .picker .box2 { width: min(640px, 94vw); max-height: 80vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; animation: g99pop .18s ease both; }
  .picker .hd { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
  .picker .hd h2 { margin: 0 0 4px; font-size: 16px; }
  .picker .hd p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .picker .list { overflow: auto; padding: 8px; }
  .picker .it { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 10px; cursor: pointer; text-decoration: none; color: inherit; }
  .picker .it:hover { background: var(--line-2); }
  .picker .it .nm { font-size: 13.5px; font-weight: 700; }
  .picker .it .dm { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 1px; }
</style>
</head>
<body data-shell="none" data-title="Edit a site">
<div class="shell" id="shell">
  <p class="empty"><span class="spin"></span>Loading…</p>
</div>
<div class="toast" id="toast"></div>
<script src="/nav.js"></script>
<script src="/edit.js"></script>
</body>
</html>
